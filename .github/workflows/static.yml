name: Deploy to Cloudflare Pages

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # e.g. v1.0.0, v1.2.3
  workflow_dispatch: # manual run from the Actions tab

# Never run two deploys at once; let a running deploy finish.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  CF_PAGES_PROJECT: cropcast # change to your Cloudflare Pages project name

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Prepare site folder
        run: |
          mkdir -p dist
          cp index.html dist/
          echo "${GITHUB_REF_NAME}" > dist/version.txt

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main
